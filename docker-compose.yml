services:
  backend:
    build: ./backend
    container_name: ava_home_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: ava_home_postgres
    environment:
      POSTGRES_DB: ava_home_db
      POSTGRES_USER: ava_user
      POSTGRES_PASSWORD: strong_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
